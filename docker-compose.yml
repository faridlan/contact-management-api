version: "3.9"

services:
  api:
    image: nulhakim/contact-management-api
    build: .
    container_name: contact-management-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - psqldb_network
    restart: unless-stopped

networks:
  psqldb_network:
    external: true